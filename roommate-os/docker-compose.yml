# ── ROOMMATE OS — Local Development Stack ──────────────────
# Services: PostgreSQL 16 + PostGIS, Redis 7, Backend API, MinIO
# Run: docker compose up postgres redis -d

services:
  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: roommate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roommate_os
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: roommate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommate -d roommate_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: roommate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

