version: "3.9"

# ── ROOMMATE OS — Local Development Stack ──────────────────
# Services: PostgreSQL 16 + PostGIS, Redis 7, Backend API, MinIO
# Run: docker compose up --build
# Seed: docker compose exec backend python scripts/seed_dev.py

services:
  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: roommate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roommate_os
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: roommate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommate -d roommate_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: roommate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object Storage (MinIO — local S3-compatible) ──────────
  minio:
    image: minio/minio:latest
    container_name: roommate_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roommate_minio
      MINIO_ROOT_PASSWORD: roommate_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roommate_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://roommate:roommate@postgres:5432/roommate_os
      DATABASE_URL_SYNC: postgresql+psycopg2://roommate:roommate@postgres:5432/roommate_os
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:

